<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MTT Opportunity ID Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>MTT Opportunity ID Generator</h1>
</header>

<!-- ==================== LOGIN SCREEN ==================== -->
<main id="login-screen" class="screen">
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" />

    <button type="submit" id="login-button">Log In</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</main>

<!-- ==================== MAIN APP SCREEN ==================== -->
<main id="app-screen" class="screen hidden">

  <div class="user-bar">
    <span>Logged in as: <strong id="user-name"></strong> (<span id="user-role"></span>)</span>
    <button id="logout-button">Logout</button>
  </div>

  <section id="generate-section">
    <h2>Generate Opportunity ID</h2>
    <label for="description">Opportunity Description</label>
    <textarea id="description" rows="2" placeholder="e.g. 4 Days 3 Nights Kundasang and Kota Kinabalu Tour"></textarea>
    <button id="generate-button">Generate ID</button>
    <p id="generate-error" class="error" role="alert"></p>

    <div id="result-box" class="hidden">
      <p class="label">Generated Opportunity ID</p>
      <p id="result-id" class="result-id"></p>

      <p class="label">Complete Odoo Opportunity Name</p>
      <p id="result-full" class="result-full"></p>

      <button id="copy-button">Copy for Odoo</button>
      <span id="copy-confirm" class="hidden">Copied!</span>
    </div>
  </section>

  <section id="admin-export-section" class="hidden">
    <button id="export-csv-button">Export CSV</button>
  </section>

  <section id="register-section">
    <h2>Recent Opportunity IDs</h2>
    <input type="text" id="search-input" placeholder="Search by ID, description or creator..." />

    <table id="register-table">
      <thead>
        <tr>
          <th>Opportunity ID</th>
          <th>Description</th>
          <th>Created By</th>
          <th>Created At</th>
          <th>Status</th>
          <th id="admin-void-header" class="hidden">Void</th>
        </tr>
      </thead>
      <tbody id="register-body"></tbody>
    </table>
    <p id="register-status"></p>
  </section>

</main>

<!-- ==================== VOID DIALOG ==================== -->
<div id="void-modal" class="modal hidden">
  <div class="modal-box">
    <h3>Void Opportunity ID <span id="void-modal-id"></span></h3>
    <label for="void-reason">Void Reason (required)</label>
    <textarea id="void-reason" rows="2"></textarea>
    <p id="void-error" class="error" role="alert"></p>
    <div class="modal-buttons">
      <button id="void-confirm-button">Confirm Void</button>
      <button id="void-cancel-button" class="secondary">Cancel</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
